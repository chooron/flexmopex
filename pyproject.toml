[project]
name = "flexmopex"
version = "0.1.0"
description = "Flex-MOPEX: differentiable MOPEX with learned structural gates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dmg>=1.4.0",
    "hydrodl2>=1.3.4",
    "torch==2.9.1",
    "numpy>=2.2.6",
    "pandas>=2.3.0",
    "scipy>=1.15.3",
    "scikit-learn>=1.7.1",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.0.0",
    "matplotlib>=3.10",
    "geopandas>=1.1",
    "shapely>=2.0",
    "pyproj>=3.7",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools]
packages = ["train", "train.models", "train.synthetic", "train.synthetic.strict"]

[tool.ruff.lint.per-file-ignores]
"plots/*.py" = ["E402"]
"evaluate/*.py" = ["E402"]
"tests/*.py" = ["E402"]
